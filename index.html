<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Management System</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --primary-bg: #eef2ff;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 48px rgba(0, 0, 0, 0.12);
            --transition: 0.25s ease;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            min-height: 100vh;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
        }
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--gray-100);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }

        /* ===== LOGIN PAGE ===== */
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff 0%, #c7d2fe 100%);
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        .login-card .logo {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .login-card .logo span {
            color: var(--gray-700);
        }
        .login-card .subtitle {
            color: var(--gray-500);
            font-size: 0.95rem;
            margin-top: 6px;
            margin-bottom: 32px;
        }
        .login-card label {
            display: block;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--gray-700);
            margin-bottom: 4px;
        }
        .login-card select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            background: #fff;
            transition: var(--transition);
            font-size: 1rem;
        }
        .login-card select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }
        .login-card .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: var(--transition);
            margin-top: 20px;
        }
        .login-card .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.3);
        }
        .login-card .role-hint {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--gray-400);
        }
        .login-card .role-hint strong {
            color: var(--gray-600);
        }

        /* ===== APP LAYOUT ===== */
        .app {
            display: none;
            min-height: 100vh;
        }
        .app.active {
            display: flex;
            flex-direction: column;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--gray-200);
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar .brand {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar .brand i {
            font-size: 1.5rem;
        }
        .topbar .right {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .topbar .role-badge {
            background: var(--primary-bg);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar .btn-logout {
            color: var(--gray-500);
            font-weight: 500;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 8px;
            transition: var(--transition);
        }
        .topbar .btn-logout:hover {
            background: var(--gray-100);
            color: var(--danger);
        }

        /* ===== MAIN LAYOUT ===== */
        .main-layout {
            display: flex;
            flex: 1;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: #fff;
            border-right: 1px solid var(--gray-200);
            padding: 20px 0;
            flex-shrink: 0;
            height: calc(100vh - 72px);
            overflow-y: auto;
            position: sticky;
            top: 72px;
        }
        .sidebar .nav-section {
            padding: 0 16px;
            margin-bottom: 8px;
        }
        .sidebar .nav-section .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--gray-400);
            font-weight: 700;
            padding: 12px 12px 6px;
        }
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 8px;
            color: var(--gray-600);
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
            cursor: pointer;
            margin: 2px 0;
            position: relative;
        }
        .sidebar .nav-item:hover {
            background: var(--gray-100);
            color: var(--gray-800);
        }
        .sidebar .nav-item.active {
            background: var(--primary-bg);
            color: var(--primary);
            font-weight: 600;
        }
        .sidebar .nav-item .icon {
            width: 28px;
            text-align: center;
            font-size: 1.1rem;
        }
        .sidebar .nav-item .badge {
            margin-left: auto;
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 100px;
            background: var(--gray-200);
            color: var(--gray-600);
        }
        .sidebar .nav-item .badge.view {
            background: #dbeafe;
            color: #2563eb;
        }
        .sidebar .nav-item .badge.edit {
            background: #d1fae5;
            color: #059669;
        }
        .sidebar .nav-item .badge.none {
            background: #fef2f2;
            color: #dc2626;
        }
        .sidebar .nav-item .badge.own {
            background: #fef3c7;
            color: #d97706;
        }
        .sidebar .nav-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .sidebar .nav-item .perm-icon {
            font-size: 0.7rem;
            margin-left: 4px;
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            padding: 32px;
            background: var(--gray-50);
            overflow-y: auto;
            min-height: calc(100vh - 72px);
        }
        .content .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }
        .content .page-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--gray-900);
        }
        .content .page-header p {
            color: var(--gray-500);
            margin-top: 4px;
            font-size: 0.95rem;
        }
        .content .page-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 2px solid transparent;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        .btn-outline {
            background: transparent;
            border-color: var(--gray-300);
            color: var(--gray-600);
        }
        .btn-outline:hover {
            background: var(--gray-100);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .btn-xs {
            padding: 4px 10px;
            font-size: 0.7rem;
            border-radius: 6px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== CARDS ===== */
        .card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--gray-100);
        }
        .card .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card .card-title i {
            color: var(--primary);
        }

        /* ===== TABLE ===== */
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        table th {
            background: var(--gray-50);
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 2px solid var(--gray-200);
            white-space: nowrap;
        }
        table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--gray-100);
            vertical-align: middle;
        }
        table tr:hover td {
            background: var(--gray-50);
        }
        table .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ===== PERMISSION TABLE (the matrix) ===== */
        .perm-matrix {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .perm-matrix th {
            background: var(--gray-800);
            color: #fff;
            padding: 10px 14px;
            text-align: center;
            font-weight: 600;
        }
        .perm-matrix th:first-child {
            text-align: left;
            border-radius: 8px 0 0 0;
        }
        .perm-matrix th:last-child {
            border-radius: 0 8px 0 0;
        }
        .perm-matrix td {
            padding: 10px 14px;
            text-align: center;
            border-bottom: 1px solid var(--gray-200);
        }
        .perm-matrix td:first-child {
            text-align: left;
            font-weight: 500;
            color: var(--gray-700);
        }
        .perm-matrix tr:hover td {
            background: var(--gray-50);
        }
        .perm-matrix .badge-perm {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-perm.full {
            background: #d1fae5;
            color: #059669;
        }
        .badge-perm.view {
            background: #dbeafe;
            color: #2563eb;
        }
        .badge-perm.none {
            background: #fef2f2;
            color: #dc2626;
        }
        .badge-perm.own {
            background: #fef3c7;
            color: #d97706;
        }
        .badge-perm.dept {
            background: #ede9fe;
            color: #7c3aed;
        }
        .badge-perm.alloc {
            background: #fce7f3;
            color: #db2777;
        }
        .badge-perm.print {
            background: #e0e7ff;
            color: #4f46e5;
        }

        /* ===== STATS / METRICS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px 20px 16px;
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow);
        }
        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-900);
        }
        .stat-card .stat-label {
            font-size: 0.85rem;
            color: var(--gray-500);
            margin-top: 2px;
        }
        .stat-card .stat-icon {
            float: right;
            font-size: 1.8rem;
            color: var(--primary-light);
            opacity: 0.6;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--gray-700);
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            transition: var(--transition);
            background: #fff;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s ease;
        }
        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .modal .modal-close {
            font-size: 1.5rem;
            color: var(--gray-400);
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: 6px;
        }
        .modal .modal-close:hover {
            background: var(--gray-100);
            color: var(--gray-700);
        }
        .modal .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--gray-200);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 14px 24px;
            border-radius: 10px;
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            max-width: 460px;
        }
        .toast-success {
            background: #059669;
        }
        .toast-error {
            background: #dc2626;
        }
        .toast-warning {
            background: #d97706;
        }
        .toast-info {
            background: #2563eb;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .sidebar {
                width: 72px;
                padding: 12px 0;
            }
            .sidebar .nav-item span:not(.icon) {
                display: none;
            }
            .sidebar .nav-item .badge {
                display: none;
            }
            .sidebar .nav-item {
                justify-content: center;
                padding: 12px;
            }
            .sidebar .nav-item .icon {
                font-size: 1.3rem;
            }
            .sidebar .nav-section .section-title {
                display: none;
            }
            .content {
                padding: 20px;
            }
        }
        @media (max-width: 640px) {
            .topbar {
                padding: 12px 16px;
            }
            .topbar .brand {
                font-size: 1rem;
            }
            .content {
                padding: 16px;
            }
            .login-card {
                padding: 32px 20px;
            }
            .modal {
                padding: 20px;
                margin: 10px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .perm-matrix {
                font-size: 0.7rem;
            }
            .perm-matrix th,
            .perm-matrix td {
                padding: 6px 8px;
            }
            .perm-matrix .badge-perm {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--gray-400);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state h4 {
            color: var(--gray-600);
            margin-bottom: 4px;
        }

        /* ===== LOADING ===== */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--gray-200);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== MISC ===== */
        .text-muted {
            color: var(--gray-500);
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .flex {
            display: flex;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-12 {
            gap: 12px;
        }
        .items-center {
            align-items: center;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }

        .tab-bar {
            display: flex;
            gap: 4px;
            background: var(--gray-100);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-bar .tab {
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--gray-500);
            transition: var(--transition);
        }
        .tab-bar .tab.active {
            background: #fff;
            color: var(--gray-800);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .tab-bar .tab:hover:not(.active) {
            color: var(--gray-700);
        }
    </style>
</head>
<body>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== LOGIN PAGE ===== -->
    <div class="login-page" id="loginPage">
        <div class="login-card">
            <div class="logo">📋 <span>Exam</span>Flow</div>
            <p class="subtitle">Exam Management System · Role-based Access</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="roleSelect">Select Your Role</label>
                    <select id="roleSelect" required>
                        <option value="">— Choose Role —</option>
                        <option value="Admin">👑 Admin</option>
                        <option value="HOD">📚 HOD</option>
                        <option value="Faculty">🧑‍🏫 Faculty</option>
                        <option value="Office 1">📁 Office 1</option>
                        <option value="Office 2">📄 Office 2</option>
                    </select>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-arrow-right-to-bracket"></i> &nbsp; Enter Dashboard
                </button>
            </form>
            <div class="role-hint">
                <strong>💡 Hint:</strong> Each role sees only what they're permitted to.
            </div>
        </div>
    </div>

    <!-- ===== APP ===== -->
    <div class="app" id="app">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="brand">
                <i class="fas fa-clipboard-list"></i> ExamFlow
            </div>
            <div class="right">
                <span class="role-badge" id="roleBadge">
                    <i class="fas fa-user-circle"></i> <span id="roleDisplay">Admin</span>
                </span>
                <button class="btn-logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </header>

        <div class="main-layout">

            <!-- SIDEBAR -->
            <nav class="sidebar" id="sidebar"></nav>

            <!-- CONTENT -->
            <main class="content" id="content">
                <!-- Dynamic content rendered here -->
            </main>

        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <div class="modal-header">
                <h3 id="modalTitle">Modal</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ================================================================
        // 1. PERMISSION MATRIX — exactly as given
        // ================================================================
        const PERMISSION_MATRIX = {
            'Academic Year': { Admin: 'full', HOD: 'none', Faculty: 'none', 'Office 1': 'none', 'Office 2': 'view' },
            'ODD/EVEN': { Admin: 'full', HOD: 'view', Faculty: 'view', 'Office 1': 'view', 'Office 2': 'view' },
            'CIE-1/2/3': { Admin: 'full', HOD: 'view', Faculty: 'view', 'Office 1': 'view', 'Office 2': 'view' },
            'Faculty Details': { Admin: 'full', HOD: 'full', Faculty: 'own', 'Office 1': 'view', 'Office 2': 'view' },
            'Subject': { Admin: 'full', HOD: 'view', Faculty: 'full', 'Office 1': 'view', 'Office 2': 'view' },
            'Strength': { Admin: 'full', HOD: 'view', Faculty: 'full', 'Office 1': 'view', 'Office 2': 'view' },
            'Timetable': { Admin: 'full', HOD: 'full', Faculty: 'view', 'Office 1': 'view', 'Office 2': 'print' },
            'Rooms': { Admin: 'full', HOD: 'none', Faculty: 'none', 'Office 1': 'full', 'Office 2': 'view' },
            'Invigilation': { Admin: 'full', HOD: 'none', Faculty: 'none', 'Office 1': 'full', 'Office 2': 'view' },
            'Senior Supervisor': { Admin: 'full', HOD: 'none', Faculty: 'none', 'Office 1': 'full', 'Office 2': 'view' },
            'Squad': { Admin: 'full', HOD: 'none', Faculty: 'none', 'Office 1': 'full', 'Office 2': 'view' },
            'Question Paper': { Admin: 'view', HOD: 'view', Faculty: 'full', 'Office 1': 'view', 'Office 2': 'print' },
            'Pocket Verification': { Admin: 'view', HOD: 'view', Faculty: 'none', 'Office 1': 'view', 'Office 2': 'full' },
            'Conflict Check': { Admin: 'full', HOD: 'none', Faculty: 'none', 'Office 1': 'full', 'Office 2': 'view' },
            'Duty Editing': { Admin: 'full', HOD: 'none', Faculty: 'none', 'Office 1': 'full', 'Office 2': 'none' },
            'Print Reports': { Admin: 'full', HOD: 'dept', Faculty: 'own', 'Office 1': 'alloc', 'Office 2': 'full' },
            'Final Lock': { Admin: 'full', HOD: 'none', Faculty: 'none', 'Office 1': 'none', 'Office 2': 'none' }
        };

        const FUNCTIONS = Object.keys(PERMISSION_MATRIX);

        // Human-readable labels for permission levels
        const PERM_LABELS = {
            full: '✅ Full',
            view: '👁 View',
            none: '❌ None',
            own: 'Own',
            dept: 'Department',
            alloc: 'Allocation',
            print: '🖨 Print'
        };

        const PERM_CLASSES = {
            full: 'full',
            view: 'view',
            none: 'none',
            own: 'own',
            dept: 'dept',
            alloc: 'alloc',
            print: 'print'
        };

        // Icons for each function
        const FUNCTION_ICONS = {
            'Academic Year': 'fa-calendar',
            'ODD/EVEN': 'fa-toggle-on',
            'CIE-1/2/3': 'fa-pen-to-square',
            'Faculty Details': 'fa-users',
            'Subject': 'fa-book',
            'Strength': 'fa-people-group',
            'Timetable': 'fa-clock',
            'Rooms': 'fa-door-open',
            'Invigilation': 'fa-user-shield',
            'Senior Supervisor': 'fa-user-tie',
            'Squad': 'fa-people-arrows',
            'Question Paper': 'fa-file-pdf',
            'Pocket Verification': 'fa-magnifying-glass',
            'Conflict Check': 'fa-circle-exclamation',
            'Duty Editing': 'fa-pen',
            'Print Reports': 'fa-print',
            'Final Lock': 'fa-lock'
        };

        // ================================================================
        // 2. GOOGLE SHEETS CONFIG (replace with your own)
        // ================================================================
        // Deploy your Apps Script as a web app and paste the URL below.
        // The script should expose doGet() / doPost() that handle:
        //   - read: GET ?action=read&sheet=SheetName
        //   - write: POST with { action, sheet, data }
        // ================================================================
        const SHEETS_API_URL = ''; // <-- PASTE YOUR APPS SCRIPT WEB APP URL HERE

        // If you don't have the backend ready, the app will use localStorage.
        // Set USE_LOCAL_STORAGE = true to skip API calls.
        const USE_LOCAL_STORAGE = true; // set to false when API is ready

        // ================================================================
        // 3. STATE
        // ================================================================
        let currentRole = 'Admin';
        let currentTab = 'Academic Year';
        let allData = {}; // cached data by sheet name

        // ================================================================
        // 4. UTILITY FUNCTIONS
        // ================================================================
        function getPerm(functionName, role) {
            const row = PERMISSION_MATRIX[functionName];
            if (!row) return 'none';
            return row[role] || 'none';
        }

        function canEdit(functionName, role) {
            const p = getPerm(functionName, role);
            return p === 'full' || p === 'own' || p === 'dept' || p === 'alloc';
        }

        function canView(functionName, role) {
            const p = getPerm(functionName, role);
            return p !== 'none';
        }

        function canPrint(functionName, role) {
            const p = getPerm(functionName, role);
            return p === 'print' || p === 'full' || p === 'dept' || p === 'alloc';
        }

        function getSheetName(functionName) {
            return functionName.replace(/[\/\-]/g, '_');
        }

        function toast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-triangle-exclamation',
                info: 'fa-info-circle'
            };
            el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(40px)';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        function showModal(title, bodyHTML) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // ================================================================
        // 5. DATA LAYER (Google Sheets + localStorage fallback)
        // ================================================================
        async function fetchData(sheetName) {
            if (USE_LOCAL_STORAGE) {
                const key = `examflow_${sheetName}`;
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : [];
            }
            if (!SHEETS_API_URL) return [];
            try {
                const res = await fetch(`${SHEETS_API_URL}?action=read&sheet=${sheetName}`);
                const data = await res.json();
                return data || [];
            } catch (e) {
                console.error('Fetch error:', e);
                return [];
            }
        }

        async function saveData(sheetName, rows) {
            if (USE_LOCAL_STORAGE) {
                const key = `examflow_${sheetName}`;
                localStorage.setItem(key, JSON.stringify(rows));
                return true;
            }
            if (!SHEETS_API_URL) return false;
            try {
                const res = await fetch(SHEETS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'write', sheet: sheetName, data: rows })
                });
                return res.ok;
            } catch (e) {
                console.error('Save error:', e);
                return false;
            }
        }

        async function loadAllData() {
            for (const fn of FUNCTIONS) {
                const sheet = getSheetName(fn);
                allData[fn] = await fetchData(sheet);
            }
        }

        async function saveOneSheet(functionName) {
            const sheet = getSheetName(functionName);
            const rows = allData[functionName] || [];
            await saveData(sheet, rows);
        }

        // ================================================================
        // 6. RENDER SIDEBAR
        // ================================================================
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            let html = '';
            const sections = [
                { title: '📊 Core', items: ['Academic Year', 'ODD/EVEN', 'CIE-1/2/3'] },
                { title: '👥 Faculty', items: ['Faculty Details', 'Subject', 'Strength'] },
                { title: '📅 Scheduling', items: ['Timetable', 'Rooms'] },
                { title: '🔒 Exam Ops', items: ['Invigilation', 'Senior Supervisor', 'Squad'] },
                { title: '📄 Papers', items: ['Question Paper', 'Pocket Verification'] },
                { title: '⚙️ Admin', items: ['Conflict Check', 'Duty Editing', 'Print Reports', 'Final Lock'] }
            ];

            for (const section of sections) {
                html += `<div class="nav-section"><div class="section-title">${section.title}</div>`;
                for (const fn of section.items) {
                    const perm = getPerm(fn, currentRole);
                    const icon = FUNCTION_ICONS[fn] || 'fa-circle';
                    const canSee = canView(fn, currentRole);
                    const label = PERM_LABELS[perm] || perm;
                    const cls = canSee ? '' : 'disabled';
                    const active = fn === currentTab ? 'active' : '';
                    const badge = canSee ? `<span class="badge ${PERM_CLASSES[perm]}">${label}</span>` :
                        `<span class="badge none">${label}</span>`;
                    html += `
                        <div class="nav-item ${cls} ${active}" data-function="${fn}">
                            <span class="icon"><i class="fas ${icon}"></i></span>
                            <span>${fn}</span>
                            ${badge}
                        </div>
                    `;
                }
                html += '</div>';
            }

            sidebar.innerHTML = html;

            // Click handlers
            sidebar.querySelectorAll('.nav-item:not(.disabled)').forEach(el => {
                el.addEventListener('click', () => {
                    const fn = el.dataset.function;
                    if (fn) {
                        currentTab = fn;
                        renderContent();
                        renderSidebar(); // update active state
                    }
                });
            });
        }

        // ================================================================
        // 7. RENDER CONTENT
        // ================================================================
        function renderContent() {
            const content = document.getElementById('content');
            const fn = currentTab;
            const perm = getPerm(fn, currentRole);
            const canSee = canView(fn, currentRole);

            if (!canSee) {
                content.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-lock"></i>
                        <h4>Access Denied</h4>
                        <p>You don't have permission to view <strong>${fn}</strong>.</p>
                    </div>
                `;
                return;
            }

            const icon = FUNCTION_ICONS[fn] || 'fa-circle';
            const isEditable = canEdit(fn, currentRole);
            const isPrintable = canPrint(fn, currentRole);
            const rows = allData[fn] || [];

            // Build the table
            let tableHTML = '';
            if (rows.length === 0) {
                tableHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h4>No Data</h4>
                        <p>No records found for <strong>${fn}</strong>. ${isEditable ? 'Click "Add New" to create one.' : ''}</p>
                    </div>
                `;
            } else {
                const headers = Object.keys(rows[0] || {});
                let thead = '<thead><tr>';
                for (const h of headers) {
                    thead += `<th>${h}</th>`;
                }
                if (isEditable || isPrintable) {
                    thead += `<th>Actions</th>`;
                }
                thead += '</tr></thead>';

                let tbody = '<tbody>';
                for (const row of rows) {
                    tbody += '<tr>';
                    for (const h of headers) {
                        tbody += `<td>${row[h] ?? ''}</td>`;
                    }
                    if (isEditable || isPrintable) {
                        tbody += '<td><div class="actions-cell">';
                        if (isEditable) {
                            tbody += `<button class="btn btn-primary btn-xs edit-row" data-idx="${rows.indexOf(row)}"><i class="fas fa-edit"></i></button>`;
                            tbody +=
                                `<button class="btn btn-danger btn-xs delete-row" data-idx="${rows.indexOf(row)}"><i class="fas fa-trash"></i></button>`;
                        }
                        if (isPrintable) {
                            tbody +=
                                `<button class="btn btn-warning btn-xs print-row" data-idx="${rows.indexOf(row)}"><i class="fas fa-print"></i></button>`;
                        }
                        tbody += '</div></td>';
                    }
                    tbody += '</tr>';
                }
                tbody += '</tbody>';
                tableHTML = `
                    <div class="table-wrap">
                        <table>${thead}${tbody}</table>
                    </div>
                `;
            }

            // Build action buttons
            let actionsHTML = '';
            if (isEditable) {
                actionsHTML += `<button class="btn btn-primary btn-sm" id="addBtn"><i class="fas fa-plus"></i> Add New</button>`;
            }
            if (isPrintable) {
                actionsHTML += `<button class="btn btn-warning btn-sm" id="printBtn"><i class="fas fa-print"></i> Print</button>`;
            }
            // Refresh button always visible
            actionsHTML += `<button class="btn btn-outline btn-sm" id="refreshBtn"><i class="fas fa-sync"></i> Refresh</button>`;

            // Permission badge
            const permLabel = PERM_LABELS[perm] || perm;

            content.innerHTML = `
                <div class="page-header">
                    <div>
                        <h2><i class="fas ${icon}"></i> ${fn}</h2>
                        <p>Permission: <strong>${permLabel}</strong> · ${rows.length} record(s)</p>
                    </div>
                    <div class="actions">${actionsHTML}</div>
                </div>

                <div class="card">
                    ${tableHTML}
                </div>
            `;

            // ---- Event bindings ----
            const addBtn = document.getElementById('addBtn');
            if (addBtn) addBtn.addEventListener('click', () => openAddForm(fn));

            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) refreshBtn.addEventListener('click', async () => {
                const sheet = getSheetName(fn);
                allData[fn] = await fetchData(sheet);
                renderContent();
                toast('Refreshed', 'success');
            });

            // Edit rows
            document.querySelectorAll('.edit-row').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.dataset.idx);
                    openEditForm(fn, idx);
                });
            });

            // Delete rows
            document.querySelectorAll('.delete-row').forEach(el => {
                el.addEventListener('click', async () => {
                    const idx = parseInt(el.dataset.idx);
                    if (confirm(`Delete this record from "${fn}"?`)) {
                        allData[fn].splice(idx, 1);
                        await saveOneSheet(fn);
                        renderContent();
                        toast('Deleted', 'success');
                    }
                });
            });

            // Print rows
            document.querySelectorAll('.print-row').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.dataset.idx);
                    const row = allData[fn][idx];
                    if (row) printRecord(fn, row);
                });
            });

            // Print all
            const printBtn = document.getElementById('printBtn');
            if (printBtn) printBtn.addEventListener('click', () => printAll(fn));
        }

        // ================================================================
        // 8. FORMS (Add / Edit)
        // ================================================================
        function openAddForm(functionName) {
            const perm = getPerm(functionName, currentRole);
            if (!canEdit(functionName, currentRole)) {
                toast('You cannot edit this data.', 'error');
                return;
            }

            // Build dynamic form based on existing data structure
            const existing = allData[functionName] || [];
            let fields = {};
            if (existing.length > 0) {
                fields = Object.keys(existing[0]).reduce((acc, k) => { acc[k] = ''; return acc; }, {});
            } else {
                // Default fields based on function name
                const defaults = {
                    'Academic Year': { Year: '', Description: '' },
                    'ODD/EVEN': { Semester: '', Year: '' },
                    'CIE-1/2/3': { Exam: '', Date: '', Subject: '' },
                    'Faculty Details': { Name: '', Department: '', Email: '', Phone: '' },
                    'Subject': { Code: '', Name: '', Credits: '' },
                    'Strength': { Subject: '', Total: '', Present: '' },
                    'Timetable': { Day: '', Time: '', Room: '', Subject: '' },
                    'Rooms': { RoomNo: '', Capacity: '', Building: '' },
                    'Invigilation': { Exam: '', Room: '', Invigilator: '' },
                    'Senior Supervisor': { Exam: '', Supervisor: '', Room: '' },
                    'Squad': { Exam: '', SquadLead: '', Members: '' },
                    'Question Paper': { Exam: '', Subject: '', File: '' },
                    'Pocket Verification': { Exam: '', Student: '', Status: '' },
                    'Conflict Check': { Exam: '', Conflict: '', Resolution: '' },
                    'Duty Editing': { Date: '', Duty: '', AssignedTo: '' },
                    'Print Reports': { Report: '', Generated: '', By: '' },
                    'Final Lock': { Exam: '', Locked: '', LockedBy: '' }
                };
                fields = defaults[functionName] || { Name: '', Value: '' };
            }

            let formHTML = '';
            for (const [key, val] of Object.entries(fields)) {
                formHTML += `
                    <div class="form-group">
                        <label>${key}</label>
                        <input type="text" id="field_${key}" value="${val}" placeholder="Enter ${key}" />
                    </div>
                `;
            }

            const modalBody = `
                <form id="addForm">
                    ${formHTML}
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                    </div>
                </form>
            `;

            showModal(`Add New — ${functionName}`, modalBody);

            document.getElementById('addForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const form = e.target;
                const data = {};
                for (const [key] of Object.entries(fields)) {
                    const input = document.getElementById(`field_${key}`);
                    data[key] = input ? input.value.trim() : '';
                }
                // Check if empty
                const hasValue = Object.values(data).some(v => v !== '');
                if (!hasValue) {
                    toast('Please fill at least one field.', 'warning');
                    return;
                }
                allData[functionName].push(data);
                await saveOneSheet(functionName);
                closeModal();
                renderContent();
                toast('Record added!', 'success');
            });
        }

        function openEditForm(functionName, idx) {
            const perm = getPerm(functionName, currentRole);
            if (!canEdit(functionName, currentRole)) {
                toast('You cannot edit this data.', 'error');
                return;
            }
            const row = allData[functionName][idx];
            if (!row) {
                toast('Record not found.', 'error');
                return;
            }

            let formHTML = '';
            for (const [key, val] of Object.entries(row)) {
                formHTML += `
                    <div class="form-group">
                        <label>${key}</label>
                        <input type="text" id="edit_${key}" value="${val ?? ''}" placeholder="Enter ${key}" />
                    </div>
                `;
            }

            const modalBody = `
                <form id="editForm">
                    ${formHTML}
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update</button>
                    </div>
                </form>
            `;

            showModal(`Edit — ${functionName}`, modalBody);

            document.getElementById('editForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const form = e.target;
                const updated = {};
                for (const [key] of Object.entries(row)) {
                    const input = document.getElementById(`edit_${key}`);
                    updated[key] = input ? input.value.trim() : '';
                }
                allData[functionName][idx] = updated;
                await saveOneSheet(functionName);
                closeModal();
                renderContent();
                toast('Updated!', 'success');
            });
        }

        // ================================================================
        // 9. PRINT FUNCTIONS
        // ================================================================
        function printRecord(functionName, row) {
            let text = `${functionName} Record\n${'='.repeat(40)}\n`;
            for (const [k, v] of Object.entries(row)) {
                text += `${k}: ${v ?? ''}\n`;
            }
            alert(text); // simple print preview
            // Could also open a new window with formatted content
        }

        function printAll(functionName) {
            const rows = allData[functionName] || [];
            if (rows.length === 0) {
                toast('No data to print.', 'warning');
                return;
            }
            let text = `${functionName} — Full Report\n${'='.repeat(50)}\n\n`;
            for (let i = 0; i < rows.length; i++) {
                text += `Record #${i + 1}\n`;
                for (const [k, v] of Object.entries(rows[i])) {
                    text += `  ${k}: ${v ?? ''}\n`;
                }
                text += '\n';
            }
            // Open in new window for printing
            const win = window.open('', '_blank');
            if (win) {
                win.document.write(`<pre style="font-family:monospace;padding:20px;font-size:14px;">${text}</pre>`);
                win.document.title = `${functionName} Report`;
                win.print();
            } else {
                alert(text);
            }
        }

        // ================================================================
        // 10. PERMISSION MATRIX VIEW (extra: show full matrix)
        // ================================================================
        function renderPermissionMatrix() {
            const content = document.getElementById('content');
            const roles = ['Admin', 'HOD', 'Faculty', 'Office 1', 'Office 2'];
            let html = `
                <div class="page-header">
                    <h2><i class="fas fa-table"></i> Permission Matrix</h2>
                    <p>Complete access control overview</p>
                </div>
                <div class="card">
                    <div class="table-wrap">
                        <table class="perm-matrix">
                            <thead>
                                <tr>
                                    <th>Function</th>
                                    ${roles.map(r => `<th>${r}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                    `;
            for (const fn of FUNCTIONS) {
                html += `<tr><td><strong>${fn}</strong></td>`;
                for (const role of roles) {
                    const p = getPerm(fn, role);
                    const label = PERM_LABELS[p] || p;
                    const cls = PERM_CLASSES[p] || 'none';
                    html += `<td><span class="badge-perm ${cls}">${label}</span></td>`;
                }
                html += '</tr>';
            }
            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            content.innerHTML = html;
        }

        // ================================================================
        // 11. LOGIN / LOGOUT
        // ================================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('roleSelect').value;
            if (!role) {
                toast('Please select a role.', 'warning');
                return;
            }
            currentRole = role;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('app').classList.add('active');
            document.getElementById('roleDisplay').textContent = role;

            await loadAllData();
            renderSidebar();

            // Show matrix by default, or first accessible function
            const firstAccessible = FUNCTIONS.find(fn => canView(fn, currentRole));
            if (firstAccessible) {
                currentTab = firstAccessible;
                renderContent();
            } else {
                // fallback: show matrix
                renderPermissionMatrix();
            }

            toast(`Welcome, ${role}! 👋`, 'success');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            document.getElementById('app').classList.remove('active');
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('roleSelect').value = '';
            currentRole = 'Admin';
            toast('Logged out.', 'info');
        });

        // ================================================================
        // 12. INIT — load data on page load
        // ================================================================
        (async function init() {
            // Pre-load data for all sheets
            await loadAllData();
            // Show login page by default
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('app').classList.remove('active');
        })();

        // Expose functions for inline onclick
        window.closeModal = closeModal;
        window.openAddForm = openAddForm;
        window.openEditForm = openEditForm;
        window.printRecord = printRecord;
        window.printAll = printAll;

        console.log('✅ ExamFlow loaded. Permissions:', PERMISSION_MATRIX);

        if (!SHEETS_API_URL && !USE_LOCAL_STORAGE) {
