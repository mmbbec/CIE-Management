<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>CIE Examination Management System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;

      --success: #16a34a;
      --success-light: #dcfce7;

      --warning: #d97706;
      --warning-light: #fef3c7;

      --danger: #dc2626;
      --danger-light: #fee2e2;

      --purple: #7c3aed;
      --purple-light: #ede9fe;

      --bg: #f5f7fb;
      --white: #ffffff;

      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;

      --shadow:
        0 4px 18px rgba(15, 23, 42, 0.07);

      --radius: 14px;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =====================================================
       LOGIN
       ===================================================== */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(135deg, #eff6ff, #f8fafc);
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: white;
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 20px 60px rgba(15,23,42,.12);
      border: 1px solid var(--border);
    }

    .brand-login {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 30px;
    }

    .brand-login h1 {
      margin: 15px 0 5px;
      font-size: 25px;
    }

    .brand-login p {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 11px 12px;
      background: white;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.10);
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 14px;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-warning {
      background: var(--warning);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-outline {
      background: white;
      border: 1px solid var(--border);
      color: #374151;
    }

    .btn-block {
      width: 100%;
    }

    .login-message {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .link-button {
      border: none;
      background: none;
      color: var(--primary);
      font-weight: 700;
      padding: 0;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       APPLICATION
       ===================================================== */

    #app {
      display: none;
      min-height: 100vh;
    }

    #app.active {
      display: block;
    }

    .topbar {
      height: 70px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-weight: 700;
      font-size: 13px;
    }

    .user-role {
      color: var(--muted);
      font-size: 11px;
    }

    .logout {
      background: var(--danger-light);
      color: var(--danger);
      border: none;
      padding: 8px 13px;
      border-radius: 8px;
      font-weight: 700;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 70px);
    }

    .sidebar {
      width: 255px;
      background: white;
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      flex-shrink: 0;
    }

    .nav-title {
      font-size: 10px;
      font-weight: 800;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 15px 10px 8px;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 11px 12px;
      border-radius: 9px;
      margin-bottom: 3px;
      color: #4b5563;
      font-weight: 600;
      font-size: 13px;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .main {
      flex: 1;
      padding: 28px;
      min-width: 0;
    }

    /* =====================================================
       PAGE HEADER
       ===================================================== */

    .page-header {
      margin-bottom: 22px;
    }

    .page-header h2 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* =====================================================
       CARDS
       ===================================================== */

    .cards {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat-title {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      margin-top: 8px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 17px;
    }

    /* =====================================================
       ACTION GRID
       ===================================================== */

    .action-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
    }

    .action-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      background: white;
      cursor: pointer;
      transition: .2s;
    }

    .action-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .action-icon {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .action-card h3 {
      font-size: 14px;
      margin: 0 0 5px;
    }

    .action-card p {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    /* =====================================================
       TABLE
       ===================================================== */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 800;
      text-align: left;
      padding: 11px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 11px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 50px;
      font-size: 10px;
      font-weight: 800;
    }

    .badge-active {
      background: var(--success-light);
      color: var(--success);
    }

    .badge-pending {
      background: var(--warning-light);
      color: var(--warning);
    }

    .badge-danger {
      background: var(--danger-light);
      color: var(--danger);
    }

    /* =====================================================
       FORMS
       ===================================================== */

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .section-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    /* =====================================================
       MODAL
       ===================================================== */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 25px 80px rgba(0,0,0,.20);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      margin: 0;
    }

    .close {
      border: none;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 20px;
      width: 34px;
      height: 34px;
    }

    /* =====================================================
       TOAST
       ===================================================== */

    #toastContainer {
      position: fixed;
      top: 85px;
      right: 20px;
      z-index: 1000;
    }

    .toast {
      background: #111827;
      color: white;
      padding: 12px 17px;
      border-radius: 9px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      font-size: 13px;
      font-weight: 600;
      animation: slideIn .2s ease;
    }

    .toast.success {
      background: var(--success);
    }

    .toast.error {
      background: var(--danger);
    }

    .toast.warning {
      background: var(--warning);
    }

    @keyframes slideIn {
      from {
        transform: translateX(30px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* =====================================================
       PRINT
       ===================================================== */

    .print-area {
      background: white;
    }

    @media print {

      body * {
        visibility: hidden;
      }

      .print-area,
      .print-area * {
        visibility: visible;
      }

      .print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media(max-width: 800px) {

      .sidebar {
        width: 210px;
      }

      .main {
        padding: 18px;
      }

      .topbar {
        padding: 0 15px;
      }

      .user-info {
        display: none;
      }
    }

    @media(max-width: 600px) {

      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        display: flex;
        overflow-x: auto;
        padding: 8px;
      }

      .nav-title {
        display: none;
      }

      .nav-btn {
        min-width: max-content;
        margin: 0 3px;
      }

      .main {
        padding: 14px;
      }

      .login-card {
        padding: 24px;
      }
    }

  </style>
</head>

<body>

<!-- =========================================================
     TOAST
     ========================================================= -->

<div id="toastContainer"></div>


<!-- =========================================================
     LOGIN PAGE
     ========================================================= -->

<div class="login-page" id="loginPage">

  <div class="login-card">

    <div class="brand-login">

      <div class="brand-icon">
        📋
      </div>

      <h1>CIE Examination Management</h1>

      <p>
        Continuous Internal Evaluation System
      </p>

    </div>


    <!-- LOGIN FORM -->

    <div id="loginSection">

      <div class="form-group">

        <label>Official Email</label>

        <input
          type="email"
          id="loginEmail"
          placeholder="Enter official email">

      </div>


      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter password">

      </div>


      <button
        class="btn btn-primary btn-block"
        onclick="loginUserFromPage()">

        LOGIN

      </button>


      <div
        class="login-message"
        id="loginMessage">
      </div>


      <div class="login-footer">

        New user?

        <button
          class="link-button"
          onclick="showSignup()">

          Create Account

        </button>

      </div>

    </div>


    <!-- SIGNUP FORM -->

    <div
      id="signupSection"
      class="hidden">

      <h3 style="margin-top:0;">
        Create Account
      </h3>

      <p
        style="color:#6b7280;font-size:13px;margin-bottom:20px;">

        Registration requires Admin approval.

      </p>


      <div class="form-group">

        <label>Full Name *</label>

        <input
          id="signupName"
          type="text"
          placeholder="Full name">

      </div>


      <div class="form-group">

        <label>Official Email *</label>

        <input
          id="signupEmail"
          type="email"
          placeholder="College email">

      </div>


      <div class="form-group">

        <label>Mobile Number</label>

        <input
          id="signupMobile"
          type="text"
          placeholder="Mobile number">

      </div>


      <div class="form-group">

        <label>Designation *</label>

        <select id="signupDesignation">

          <option value="">
            Select Designation
          </option>

          <option>Professor</option>

          <option>Associate Professor</option>

          <option>Assistant Professor</option>

          <option>HOD</option>

          <option>Office Staff</option>

        </select>

      </div>


      <div class="form-group">

        <label>Department / Branch *</label>

        <select id="signupDepartment">

          <option value="">
            Select Department
          </option>

          <option>CSE</option>
          <option>ISE</option>
          <option>ECE</option>
          <option>EEE</option>
          <option>ME</option>
          <option>CIVIL</option>
          <option>AIML</option>
          <option>DS</option>
          <option>CHEMICAL</option>
          <option>AERONAUTICAL</option>
          <option>BIOTECH</option>
          <option>MATHEMATICS</option>
          <option>OTHER</option>

        </select>

      </div>


      <div class="form-group">

        <label>Requested Role *</label>

        <select id="signupRole">

          <option value="FACULTY">
            Faculty
          </option>

          <option value="HOD">
            HOD
          </option>

          <option value="OFFICE_STAFF_1">
            Office Staff 1
          </option>

          <option value="OFFICE_STAFF_2">
            Office Staff 2
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>Employee ID</label>

        <input
          id="signupEmployeeId"
          type="text"
          placeholder="Employee ID">

      </div>


      <div class="form-group">

        <label>Password *</label>

        <input
          id="signupPassword"
          type="password"
          placeholder="Minimum 6 characters">

      </div>


      <div class="form-group">

        <label>Confirm Password *</label>

        <input
          id="signupConfirmPassword"
          type="password"
          placeholder="Confirm password">

      </div>


      <button
        class="btn btn-primary btn-block"
        onclick="signupUserFromPage()">

        CREATE ACCOUNT

      </button>


      <div
        class="login-message"
        id="signupMessage">
      </div>


      <div class="login-footer">

        Already registered?

        <button
          class="link-button"
          onclick="showLogin()">

          Login

        </button>

      </div>

    </div>

  </div>

</div>


<!-- =========================================================
     APPLICATION
     ========================================================= -->

<div id="app">

  <header class="topbar">

    <div class="brand">

      📋 CIE Examination Management

    </div>


    <div class="user-area">

      <div class="user-info">

        <div
          class="user-name"
          id="userName">
          User
        </div>

        <div
          class="user-role"
          id="userRole">
          Role
        </div>

      </div>


      <button
        class="logout"
        onclick="logout()">

        Logout

      </button>

    </div>

  </header>


  <div class="layout">

    <aside
      class="sidebar"
      id="sidebar">
    </aside>


    <main
      class="main"
      id="mainContent">
    </main>

  </div>

</div>


<!-- =========================================================
     MODAL
     ========================================================= -->

<div
  class="modal"
  id="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="modalTitle">
        Form
      </h3>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>


<script>

/* ============================================================
   GLOBAL STATE
   ============================================================ */

let currentUser = null;
let currentPage = "dashboard";


/* ============================================================
   TOAST
   ============================================================ */

function toast(message, type = "info") {

  const container =
    document.getElementById("toastContainer");

  const div =
    document.createElement("div");

  div.className =
    "toast " + type;

  div.textContent = message;

  container.appendChild(div);

  setTimeout(() => {

    div.remove();

  }, 3500);
}


/* ============================================================
   LOGIN / SIGNUP SCREEN
   ============================================================ */

function showSignup() {

  document
    .getElementById("loginSection")
    .classList.add("hidden");

  document
    .getElementById("signupSection")
    .classList.remove("hidden");

}


function showLogin() {

  document
    .getElementById("signupSection")
    .classList.add("hidden");

  document
    .getElementById("loginSection")
    .classList.remove("hidden");

}


function loginUserFromPage() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");


  if (!email || !password) {

    message.textContent =
      "Please enter email and password.";

    return;

  }


  message.textContent =
    "Checking login...";


  google.script.run

    .withSuccessHandler(function(user) {

      if (!user || !user.success) {

        message.textContent =
          "Login failed.";

        return;

      }


      currentUser = user;

      message.textContent = "";

      openApplication();

    })

    .withFailureHandler(function(error) {

      message.textContent =
        error.message ||
        "Invalid login.";

    })

    .loginUser(
      email,
      password
    );

}


/* ============================================================
   SIGNUP
   ============================================================ */

function signupUserFromPage() {

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const mobile =
    document
      .getElementById("signupMobile")
      .value
      .trim();

  const designation =
    document
      .getElementById("signupDesignation")
      .value;

  const department =
    document
      .getElementById("signupDepartment")
      .value;

  const role =
    document
      .getElementById("signupRole")
      .value;

  const employeeId =
    document
      .getElementById("signupEmployeeId")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const confirmPassword =
    document
      .getElementById("signupConfirmPassword")
      .value;

  const message =
    document.getElementById("signupMessage");


  if (
    !name ||
    !email ||
    !designation ||
    !department ||
    !password
  ) {

    message.textContent =
      "Please fill all required fields.";

    return;

  }


  if (password.length < 6) {

    message.textContent =
      "Password must contain at least 6 characters.";

    return;

  }


  if (password !== confirmPassword) {

    message.textContent =
      "Passwords do not match.";

    return;

  }


  const data = {

    name: name,

    email: email,

    mobile: mobile,

    designation: designation,

    department: department,

    role: role,

    employeeId: employeeId,

    password: password

  };


  message.textContent =
    "Creating account...";


  google.script.run

    .withSuccessHandler(function(result) {

      message.textContent =
        result.message ||
        "Registration successful.";

      if (result.success) {

        setTimeout(function() {

          showLogin();

        }, 1500);

      }

    })

    .withFailureHandler(function(error) {

      message.textContent =
        error.message ||
        "Registration failed.";

    })

    .signupUser(data);

}


/* ============================================================
   OPEN APPLICATION
   ============================================================ */

function openApplication() {

  document
    .getElementById("loginPage")
    .style.display = "none";

  document
    .getElementById("app")
    .classList.add("active");


  document
    .getElementById("userName")
    .textContent =
      currentUser.name || currentUser.email;


  document
    .getElementById("userRole")
    .textContent =
      formatRole(currentUser.role);


  buildSidebar();

  showDashboard();

}


function formatRole(role) {

  const map = {

    "ADMIN":
      "Administrator",

    "HOD":
      "Head of Department",

    "FACULTY":
      "Faculty",

    "OFFICE_STAFF_1":
      "Office Staff 1 — Allocation",

    "OFFICE_STAFF_2":
      "Office Staff 2 — Printing"

   ============================================================ */

function showDashboard() {

  showPage("dashboard");

}


function showPage(page) {

  currentPage = page;

  document
    .querySelectorAll(".nav-btn")
    .forEach(function(button) {

      button.classList.toggle(
        "active",
        button.dataset.page === page
      );

    });


  const main =
    document.getElementById("mainContent");


  const role =
    currentUser.role;


  if (page === "dashboard") {

    renderDashboard(main, role);

    return;

  }


  if (role === "ADMIN") {

    renderAdminPage(main, page);

    return;

  }


  if (role === "HOD") {

    renderHODPage(main, page);

    return;

  }


  if (role === "FACULTY") {

    renderFacultyPage(main, page);

    return;

  }


  if (role === "OFFICE_STAFF_1") {

    renderOffice1Page(main, page);

    return;

  }


  if (role === "OFFICE_STAFF_2") {

    renderOffice2Page(main, page);

    return;

  }

}

function callPrintFunction(functionName) {

  toast(
    "Preparing printout...",
    "info"
  );


  if (
    typeof google === "undefined" ||
    !google.script ||
    !google.script.run
  ) {

    window.print();

    return;

  }


  const runner =
    google.script.run

      .withSuccessHandler(function(result) {

        if (
          typeof result === "string" &&
          result.trim()
        ) {

          openPrintWindow(result);

        } else {

          window.print();

        }

      })

      .withFailureHandler(function(error) {

        toast(
          error.message ||
          "Print function is not yet connected.",
          "warning"
        );

      });


  if (
    typeof runner[functionName] === "function"
  ) {

    runner[functionName]();

  } else {

    toast(
      "Backend print function not yet connected.",
      "warning"
    );

  }

}

   ============================================================ */

function loadPendingUsers() {

  const area =
    document.getElementById(
      "pendingUsersArea"
    );


  area.innerHTML =
    "<p>Loading...</p>";


  if (
    typeof google === "undefined" ||
    !google.script ||
    !google.script.run
  ) {

    area.innerHTML =
      "<p>Apps Script backend unavailable.</p>";

    return;

  }


  google.script.run

    .withSuccessHandler(function(users) {

      if (
        !users ||
        !users.length
      ) {

        area.innerHTML = `

          <p style="color:#6b7280;">

            No pending registrations.

          </p>

        `;

        return;

      }


      let rows = "";


      users.forEach(function(user) {

        rows += `

          <tr>

            <td>
              ${escapeHTML(user.name || "")}
            </td>

            <td>
              ${escapeHTML(user.email || "")}
            </td>

            <td>
              ${escapeHTML(user.role || "")}
            </td>

            <td>
              ${escapeHTML(user.department || "")}
            </td>

            <td>

              <button
                class="btn btn-success"
                onclick="approveUser('${escapeAttribute(user.userId || user.email)}')">

                Approve

              </button>

              <button
                class="btn btn-danger"
                onclick="rejectUser('${escapeAttribute(user.userId || user.email)}')">

                Reject

              </button>

            </td>

          </tr>

        `;

      });


      area.innerHTML = `

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Department</th>
                <th>Action</th>

              </tr>

            </thead>

            <tbody>

              ${rows}

            </tbody>

          </table>

        </div>

      `;

    })

    .withFailureHandler(function(error) {

      area.innerHTML = `

        <p style="color:#dc2626;">

          ${escapeHTML(
            error.message ||
            "Unable to load users."
          )}

        </p>

      `;

    })

    .getPendingUsers();

}


function approveUser(userId) {

  if (!confirm(
    "Approve this user?"
  )) return;


  google.script.run

    .withSuccessHandler(function(result) {

      toast(
        result.message ||
        "User approved.",
        "success"
      );

      loadPendingUsers();

    })

    .withFailureHandler(function(error) {

      toast(
        error.message ||
        "Approval failed.",
        "error"
      );

    })

    .approveUser(userId);

}


function rejectUser(userId) {

  if (!confirm(
    "Reject this user?"
  )) return;


  google.script.run

    .withSuccessHandler(function(result) {

      toast(
        result.message ||
        "User rejected.",
        "success"
      );

      loadPendingUsers();

    })

    .withFailureHandler(function(error) {

      toast(
        error.message ||
        "Rejection failed.",
        "error"
      );

    })

    .rejectUser(userId);

}

function submitBackend(functionName) {

}


function callBackend(functionName, data) {

  if (
    typeof google === "undefined" ||
    !google.script ||
    !google.script.run
  ) {

    toast(
      "Apps Script backend is not available.",
      "error"
    );

    return;

  }


  toast(
    "Saving...",
    "info"
  );


  const runner =
    google.script.run

      .withSuccessHandler(function(result) {

        if (
          result &&
          result.message
        ) {

          toast(
            result.message,
            result.success === false
              ? "warning"
              : "success"
          );

        } else {

          toast(
            "Saved successfully.",
            "success"
          );

        }

      })

      .withFailureHandler(function(error) {

        toast(
          error.message ||
          "Backend function is not connected.",
          "error"
        );

      });


  if (
    typeof runner[functionName] === "function"
  ) {

    runner[functionName](data);

  } else {

    toast(
      functionName +
      " is not yet added to Code.gs.",
      "warning"
    );

  }

}

function getValue(id) {

    document.getElementById(id);

  return element
    ? element.value.trim()
    : "";

}


/* ============================================================
   MODAL
   ============================================================ */

function openModal(title, body) {

  document
    .getElementById("modalTitle")
    .textContent = title;

  document
    .getElementById("modalBody")
    .innerHTML = body;

  document
    .getElementById("modal")
    .classList.add("open");

}


function closeModal() {

  document
    .getElementById("modal")
    .classList.remove("open");

}


/* ============================================================
   SECURITY / DISPLAY HELPERS
   ============================================================ */

function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return escapeHTML(value)
    .replace(/`/g, "&#096;");

}
